<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Hello Dosto!!</h1>


    <form action="">
        <div>
            <div>
                <label for="name">Name : </label>
            <input type="text" id="name">
            <span class="errormassage" style="color: red;"></span>
            <br>
            </div>
           <div>
             <label for="email">Email : </label>
            <input type="email" id="email">
             <span class="errormassage" style="color: red;"></span>
            <br>
           </div>
          <div>
              <label for="pass">Password :</label>
            <input type="password" id="pass">
            <p id="hint" class="hidden">Must be in 8 characters</p>
             <span class="errormassage" style="color: red;"></span>
            <br>
          </div>

          <div>
              <label for="bio">Bio :</label>
            <textarea name="bio" id="bio" placeholder="Enter your bio"></textarea>
            <p id="charcount">150 charecters remainig</p>
          </div>

            <div>
                <label for="Country">Select Your Country :</label>
                <select name="Country" id="Country">
                    <option value="india">India</option>
                    <option value="brazil">Brazil</option>
                    <option value="uk">UK</option>
                </select>
            </div>
            <div>
                
            <input type="checkbox" id="checkbox">
            <label for="checkbox">T agree the terms and conditions</label>
             <span class="errormassage" style="color: red;"></span>
            <br>
            </div>
            <button>Create Account</button>
            <h2 id="successmsg" class="hidden">your Account has created successfully!!</h2>

        </div>
    </form>


    <script src="index.js"></script>
</body>
</html>
